workflows:
  android-debug:
    name: FlashGuard Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.22.0
      java: 17
    scripts:
      - name: Find project root
        script: |
          echo "=== Repo structure ==="
          ls -la
          echo "=== Finding pubspec.yaml ==="
          find . -name "pubspec.yaml" -maxdepth 4
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -maxdepth 4 | head -1))
          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $CM_ENV
      - name: Get Flutter packages
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Build debug APK
        script: |
          cd $PROJECT_DIR
          flutter build apk --debug
    artifacts:
      - "**/app-debug.apk"
