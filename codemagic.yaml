workflows:
  android-debug:
    name: FlashGuard Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.22.0
      java: 17
    scripts:
      - name: Build APK
        script: |
          echo "=== Files in repo root ==="
          ls -la
          echo "=== Searching for pubspec.yaml ==="
          find . -name "pubspec.yaml" -maxdepth 5
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -maxdepth 5 | head -1))
          echo "=== Building from: $PROJECT_DIR ==="
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --debug
    artifacts:
      - "**/app-debug.apk"
