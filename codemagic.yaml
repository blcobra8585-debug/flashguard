workflows:
  android-release:
    name: FlashGuard Release APK
    max_build_duration: 60
    environment:
      flutter: 3.32.0
      java: 17
    scripts:
      - name: Fetch dependencies
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
