name: parent_dashboard
description: FlashGuard Parent Monitoring Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_database: ^10.4.0
  firebase_storage: ^11.6.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  http: ^1.2.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.4
  open_file: ^3.3.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  photo_view: ^0.14.0
  audioplayers: ^6.0.0
  flutter_local_notifications: ^16.3.2
  dio: ^5.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
