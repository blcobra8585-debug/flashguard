name: flashguard
description: FlashGuard parental monitoring app.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  firebase_database: ^10.4.0
  firebase_storage: ^11.6.0
  flutter_background_service: ^5.0.5
  geolocator: ^11.0.0
  camera: ^0.10.5+9
  flutter_local_notifications: ^16.3.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
